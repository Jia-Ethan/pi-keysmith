name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install quality deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-quality.txt

      - name: py_compile
        run: python -m py_compile pi-keysmith.py scripts/build_release.py

      - name: ruff
        run: python -m ruff check pi-keysmith.py tests scripts

      - name: pytest
        run: python -m pytest -p no:cacheprovider -q tests

      - name: coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch --parallel-mode -m pytest -p no:cacheprovider -q tests
          python -m coverage combine
          python -m coverage report --include=pi-keysmith.py --fail-under=80
