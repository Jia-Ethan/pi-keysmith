name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-quality.txt

      - name: Blocking tests
        run: |
          python -m py_compile pi-keysmith.py scripts/build_release.py
          python -m ruff check pi-keysmith.py tests scripts
          python -m pytest -p no:cacheprovider -q tests

      - name: Build release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          SOURCE_COMMIT="$(git rev-parse --verify 'HEAD^{commit}')"
          python scripts/build_release.py "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --output-dir dist
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Verify assets against GitHub tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ github.ref_name }}"
          echo "Tag $tag points to $(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$(git rev-parse --verify "refs/tags/${tag}^{commit}")"

      - name: Upload draft release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/pi-keysmith-*.zip
            dist/pi-keysmith-*.tar.gz
            dist/pi-keysmith-*.py
            dist/SHA256SUMS
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
